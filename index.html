<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>The Calculator 3000</title>
</head>

<body>
  <section class="secao-visor">
    <div class="visor"><span class="valor">visor</span></div>
  </section>

  <section class="secao-teclado">

    <div class="teclado">
      <div class="numeros">
        <button class="tecla">0</button>
        <button class="tecla">1</button>
        <button class="tecla">2</button>
        <button class="tecla">3</button>
        <button class="tecla">4</button>
        <button class="tecla">5</button>
        <button class="tecla">6</button>
        <button class="tecla">7</button>
        <button class="tecla">8</button>
        <button class="tecla">9</button>
        <button class="tecla">.</button>
        <button class="tecla" id="igual">=</button>
      </div>
      <div class="operadores">
        <button class="tecla-operadores">+</button>
        <button class="tecla-operadores">-</button>
        <button class="tecla-operadores">x</button>
        <button class="tecla-operadores">÷</button>
      </div>
    </div>
  </section>
</body>
</html>
