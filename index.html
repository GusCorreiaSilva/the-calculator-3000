<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>The Calculator 3000</title>
</head>

<body>

  <section class="secao-visor">
    <div class="visor"><span class="valor"></span></div>
  </section>

  <section class="secao-teclado">

    <div class="teclado">
      <div class="numeros">
        <button class="tecla numero" data-valor="0">0</button>
        <button class="tecla numero" data-valor="1">1</button>
        <button class="tecla numero" data-valor="2">2</button>
        <button class="tecla numero" data-valor="3">3</button>
        <button class="tecla numero" data-valor="4">4</button>
        <button class="tecla numero" data-valor="5">5</button>
        <button class="tecla numero" data-valor="6">6</button>
        <button class="tecla numero" data-valor="7">7</button>
        <button class="tecla numero" data-valor="8">8</button>
        <button class="tecla numero" data-valor="9">9</button>
        <button class="tecla">.</button>
        <button class="tecla igual">=</button>
      </div>



      <div class="secao-operadores">
        <button class="tecla operadores">+</button>
        <button class="tecla operadores">-</button>
        <button class="tecla operadores">x</button>
        <button class="tecla operadores">÷</button>
      </div>
    </div>
  </section>
  <script src="js/script.js"></script>
</body>

</html>
